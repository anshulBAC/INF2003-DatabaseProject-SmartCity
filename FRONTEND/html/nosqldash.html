<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Singapore Smart City Dashboard</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 380px;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      color: white;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 1000;
      box-shadow: 4px 0 10px rgba(0, 0, 0, 0.2);
    }
    .sidebar::-webkit-scrollbar {
      width: 6px;
    }
    .sidebar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
    }
    .sidebar h1 {
      font-size: 1.4em;
      margin-bottom: 8px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }
    .sidebar h2 {
      font-size: 0.9em;
      opacity: 0.85;
      margin-bottom: 12px;
      font-weight: 400;
    }
    #map {
      position: fixed;
      left: 380px;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
    }

    .section {
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }
    .section h3 {
      font-size: 0.9em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.9;
    }
    .section h3 span.emoji {
      font-size: 1.1em;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.2);
      font-size: 0.75em;
      margin-right: 6px;
      margin-bottom: 4px;
    }
    .chip span.dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 6px;
    }
    .stat-card {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.75em;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      opacity: 0.7;
    }
    .stat-value {
      font-weight: 600;
      font-size: 1em;
    }
    .stat-meta {
      font-size: 0.7em;
      opacity: 0.7;
    }

    .layer-toggle {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
      font-size: 0.8em;
    }
    .layer-toggle label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .layer-toggle input[type="checkbox"] {
      accent-color: #ffeb3b;
    }

    .marquee-box {
      margin-top: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.3);
      font-size: 0.8em;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }
    .marquee-title {
      font-size: 0.75em;
      opacity: 0.8;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .marquee-wrapper {
      overflow: hidden;
      position: relative;
    }
    .marquee-content {
      display: inline-block;
      white-space: nowrap;
      will-change: transform;
    }
    @keyframes marqueeScroll {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }
    .alert-item {
      margin-right: 64px;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.75em;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .filter-input {
      width: 100%;
      margin-top: 4px;
      padding: 4px 6px;
      border-radius: 4px;
      border: none;
      font-size: 0.75em;
      outline: none;
    }

    .legend-list {
      list-style: none;
      font-size: 0.75em;
      margin-top: 4px;
    }
    .legend-list li {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .legend-color {
      width: 14px;
      height: 6px;
      border-radius: 3px;
      display: inline-block;
    }

    .leaflet-popup-content {
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h1>Singapore Smart City</h1>
    <h2>Integrated Real-Time Transport & City Dashboard</h2>

    <div class="section">
      <h3><span class="emoji">🛰️</span> Layers</h3>
      <div class="layer-toggle">
        <label>
          <input type="checkbox" id="toggle-incidents" checked />
          <span>Traffic Incidents</span>
        </label>
        <label>
          <input type="checkbox" id="toggle-roadworks" checked />
          <span>Roadworks</span>
        </label>
        <label>
          <input type="checkbox" id="toggle-vms" checked />
          <span>VMS / EMAS</span>
        </label>
        <label>
          <input type="checkbox" id="toggle-train" checked />
          <span>Train Service Alerts</span>
        </label>
      </div>
    </div>

    <div class="section">
      <h3><span class="emoji">⚠️</span> Live Congestion & Alerts</h3>
      <div class="marquee-box">
        <div class="marquee-title">
          <span>Live City Feed</span>
        </div>
        <div class="marquee-wrapper">
          <div class="marquee-content" id="alert-marquee">
            Loading announcements...
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <h3><span class="emoji">📊</span> Cache Snapshot</h3>
      <div class="stat-grid" id="cache-stats">
        <!-- Populated by JS -->
      </div>
      <div class="btn-row">
        <button class="btn" id="btn-refresh-cache">
          🔄 Refresh Cache Stats
        </button>
        <button class="btn" id="btn-refresh-data">
          🚀 Force Data Refresh
        </button>
        <button class="btn" id="btn-clear-cache">
          🗑️ Clear Cache
        </button>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([1.3521, 103.8198], 12);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    const incidentLayer = L.layerGroup().addTo(map);
    const roadworkLayer = L.layerGroup().addTo(map);
    const vmsLayer = L.layerGroup().addTo(map);
    const trainLayer = L.layerGroup().addTo(map);

    const allAlerts = {
      train: [],
      vms: [],
      incidents: [],
      roadworks: [],
    };

    async function fetchData(endpoint) {
      try {
        const base = "http://localhost:5000";
        const url = `${base}${endpoint}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`${endpoint} → ${res.status}`);
        const json = await res.json();
        return json;
      } catch (err) {
        console.error(`${endpoint} failed:`, err.message);
        return { data: [] };
      }
    }

    function getIncidentIcon(typeRaw) {
      const type = (typeRaw || "").toLowerCase();
      let emoji = "⚠️"; // Default for Other Incidents
      
      if (type.includes("accident") || type.includes("road accident")) {
        emoji = "💥"; // Road Accidents
      } else if (type.includes("vehicle breakdown")) {
        emoji = "🚗"; // Vehicle Breakdown
      } else if (type.includes("heavy traffic")) {
        emoji = "🚙"; // Heavy Traffic
      } else if (type.includes("roadwork") || type.includes("major roadwork")) {
        emoji = "🚧"; // Major Roadworks
      } else if (type.includes("flood") || type.includes("flash flood")) {
        emoji = "🌊"; // Flash Flood
      } else if (type.includes("traffic light") || type.includes("faulty traffic light")) {
        emoji = "🚦"; // Faulty Traffic Lights
      } else if (type.includes("obstacle")) {
        emoji = "⛔"; // Obstacle
      }
      
      return L.divIcon({
        className: "",
        html: `<div style="
          font-size:20px;
          line-height:1;
          filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
        ">${emoji}</div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10],
      });
    }

    function clearLayers() {
      incidentLayer.clearLayers();
      roadworkLayer.clearLayers();
      vmsLayer.clearLayers();
      trainLayer.clearLayers();
    }

    async function loadIncidents() {
      incidentLayer.clearLayers();
      const json = await fetchData("/api/traffic/incidents");
      const data = json.data || [];

      allAlerts.incidents = data;

      data.forEach((inc) => {
        if (!inc.latitude || !inc.longitude) return;
        const marker = L.marker([inc.latitude, inc.longitude], {
          icon: getIncidentIcon(inc.type),
        });
        marker.bindPopup(
            `<b>${inc.type || "Traffic Incident"}</b><br/>
            ${inc.message || "No details"}`
        );
        marker.addTo(incidentLayer);
      });

      updateMarquee();
    }

    async function loadRoadworks() {
      roadworkLayer.clearLayers();
      const json = await fetchData("/api/roadworks");
      const data = json.data || [];

      allAlerts.roadworks = data;

      data.forEach((rw) => {
        if (!rw.location || !rw.roadName) return;
        const marker = L.circleMarker([rw.latitude || 1.3521, rw.longitude || 103.8198], {
          radius: 6,
          color: "#ffc107",
          fillColor: "#ffeb3b",
          fillOpacity: 0.7,
        });
        marker.bindPopup(
          `<b>Roadworks</b><br/>
           Road: ${rw.roadName}<br/>
           Location: ${rw.location}<br/>
           Start: ${rw.startDate || "-"}<br/>
           End: ${rw.endDate || "-"}`
        );
        marker.addTo(roadworkLayer);
      });

      updateMarquee();
    }

    async function loadVMS() {
      vmsLayer.clearLayers();
      const json = await fetchData("/api/vms");
      const data = json.data || [];

      allAlerts.vms = data;

      // VMS/EMAS markers removed - data still loaded for marquee

      updateMarquee();
    }

    async function loadTrainAlerts() {
      trainLayer.clearLayers();
      const json = await fetchData("/api/train/alerts");
      const data = json.data || [];

      allAlerts.train = data;

      data.forEach((alert) => {
        const center = [1.3521, 103.8198];
        const marker = L.circleMarker(center, {
          radius: 8,
          color: "#00e5ff",
          fillColor: "#00e5ff",
          fillOpacity: 0.5,
        });
        marker.bindPopup(
          `<b>Train Service Alert</b><br/>
           Line: ${alert.line || "-"}<br/>
           Status: ${alert.status || "-"}<br/>
           Msg: ${alert.content || "No message"}`
        );
        marker.addTo(trainLayer);
      });

      updateMarquee();
    }

    function updateMarquee() {
      const marqueeContent = document.getElementById("alert-marquee");
      if (!marqueeContent) return;

      let items = [];

      if (Array.isArray(allAlerts.train) && allAlerts.train.length > 0) {
        allAlerts.train.forEach((alert) => {
          const msg =
            alert.content ||
            alert.Content ||
            alert.message ||
            alert.Message ||
            "";
          if (!msg.trim()) return;
          items.push(
            `<span class="alert-item">🚆 ${alert.line || "Train"}: ${msg}</span>`
          );
        });
      }

      if (Array.isArray(allAlerts.vms) && allAlerts.vms.length > 0) {
        allAlerts.vms.forEach((vms) => {
          const raw = vms.Message ?? vms.message ?? "";
          const message = String(raw).trim();
          if (!message) return;
          items.push(
            `<span class="alert-item">🪧 VMS: ${message}</span>`
          );
        });
      }

      if (Array.isArray(allAlerts.incidents) && allAlerts.incidents.length > 0) {
        allAlerts.incidents.forEach((inc) => {
          const text = inc.message || inc.Message || "";
          const type = (inc.type || "").toUpperCase();
          if (!text.trim()) return;
          items.push(
            `<span class="alert-item">🚧 ${type}: ${text}</span>`
          );
        });
      }

      if (Array.isArray(allAlerts.roadworks) && allAlerts.roadworks.length > 0) {
        allAlerts.roadworks.forEach((rw) => {
          const loc = rw.location || rw.Location || rw.other || rw.Other || "";
          const rd = rw.roadName || rw.RoadName || "";
          if (!loc.trim() && !rd.trim()) return;
          items.push(
            `<span class="alert-item">🛠️ Roadworks: ${rd} – ${loc}</span>`
          );
        });
      }

      if (items.length === 0) {
        marqueeContent.innerHTML =
          '<span class="alert-item">No active alerts or announcements.</span>';
        marqueeContent.style.animation = "none";
        return;
      }

      const html = items.join("");
      marqueeContent.innerHTML = html + html;

      const baseDuration = 30;
      const duration = Math.max(10, (items.length / 5) * baseDuration);
      marqueeContent.style.animation = `marqueeScroll ${duration}s linear infinite`;
    }

    async function loadAllData() {
      await Promise.all([
        loadIncidents(),
        loadRoadworks(),
        loadVMS(),
        loadTrainAlerts(),
      ]);
      await loadCacheStats();
      updateMarquee();
    }

    function renderCacheStats(stats) {
      const container = document.getElementById("cache-stats");
      container.innerHTML = "";

      const keys = Object.keys(stats || {});
      if (keys.length === 0) {
        container.innerHTML =
          '<div class="stat-card"><div class="stat-label">No cache data</div></div>';
        return;
      }

      keys.forEach((key) => {
        const s = stats[key];
        const prettyName = key
          .replace(/_/g, " ")
          .replace(/\b\w/g, (c) => c.toUpperCase());

        const age =
          s.ageSeconds != null ? `${s.ageSeconds}s ago` : "N/A";

        const div = document.createElement("div");
        div.className = "stat-card";
        div.innerHTML = `
          <div class="stat-label">${prettyName}</div>
          <div class="stat-value">${s.totalRecords ?? 0} records</div>
          <div class="stat-meta">Last: ${age}</div>
        `;
        container.appendChild(div);
      });
    }

    async function loadCacheStats() {
      const json = await fetchData("/api/cache/stats");
      if (json.cacheStats) {
        renderCacheStats(json.cacheStats);
      }
    }

    document
      .getElementById("toggle-incidents")
      .addEventListener("change", (e) => {
        if (e.target.checked) {
          map.addLayer(incidentLayer);
        } else {
          map.removeLayer(incidentLayer);
        }
      });

    document
      .getElementById("toggle-roadworks")
      .addEventListener("change", (e) => {
        if (e.target.checked) {
          map.addLayer(roadworkLayer);
        } else {
          map.removeLayer(roadworkLayer);
        }
      });

    document
      .getElementById("toggle-vms")
      .addEventListener("change", (e) => {
        if (e.target.checked) {
          map.addLayer(vmsLayer);
        } else {
          map.removeLayer(vmsLayer);
        }
      });

    document
      .getElementById("toggle-train")
      .addEventListener("change", (e) => {
        if (e.target.checked) {
          map.addLayer(trainLayer);
        } else {
          map.removeLayer(trainLayer);
        }
      });

    document
      .getElementById("btn-refresh-cache")
      .addEventListener("click", loadCacheStats);

    document
      .getElementById("btn-refresh-data")
      .addEventListener("click", loadAllData);

    document
      .getElementById("btn-clear-cache")
      .addEventListener("click", async () => {
        try {
          const base = "http://localhost:5000";
          const res = await fetch(`${base}/api/cache/clear`, { 
            method: "DELETE" 
          });
          if (res.ok) {
            await loadCacheStats();
            await loadAllData();
          }
        } catch (err) {
          console.error("Clear cache error:", err.message);
        }
      });

    window.addEventListener("load", () => {
      loadAllData();
      setInterval(loadAllData, 5 * 60 * 1000);
    });
  </script>
</body>
</html>
