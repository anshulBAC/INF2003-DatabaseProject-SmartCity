<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart City Public Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/ui.js" defer></script>
  <script src="../js/traffic.js" defer></script>

  <style>
    :root {
      --bg: #0b0f14;
      --card: #121a22;
      --muted: #6b7a90;
      --text: #e6edf3;
      --accent: #00c2ff;
      --danger: #ff6b6b;
      --border: #1f2a36;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    nav {
      display: flex;
      gap: 16px;
      background: #121a22;
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    nav a:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    nav a.active {
      background: var(--accent);
      color: #000;
    }

    nav a#logout-btn {
      background: var(--danger);
      color: #fff;
      margin-left: auto;
    }

    nav a#logout-btn:hover {
      background: #ff4c4c;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    input[type="text"],
    select {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0d141a;
      color: var(--text);
    }

    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    button.secondary {
      background: #333;
      color: var(--text);
    }

    .traffic-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .traffic-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .traffic-card h3 {
      font-size: 18px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .traffic-meta {
      font-size: 14px;
      color: var(--muted);
    }

    .badge {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      text-transform: capitalize;
    }

    .badge.smooth {
      background: #2ecc71;
      color: white;
    }

    .badge.moderate {
      background: #f1c40f;
      color: black;
    }

    .badge.heavy {
      background: #e67e22;
      color: white;
    }

    .badge.jam {
      background: #e74c3c;
      color: white;
    }

    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .popup-card {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      max-width: 600px;
      width: 90%;
      position: relative;
      animation: popupFade 0.2s ease-in-out;
    }

    .popup-close {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 20px;
      cursor: pointer;
      color: var(--muted);
    }

    .popup-close:hover {
      color: var(--accent);
    }

    .hidden {
      display: none !important;
    }

    @keyframes popupFade {
      from {
        transform: scale(0.95);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="traffic.html" class="active">Traffic</a>
    <a href="transport.html">Transport</a>
    <a href="weather.html">Weather</a>
    <a href="accidents.html">Accidents</a>
    <a href="#" id="logout-btn" style="margin-left:auto;">Logout</a>
  </nav>


  <div class="container">
    <h1>Real-time Traffic Updates</h1>
    <p class="muted">Auto-refresh every 30 seconds</p>

    <div class="controls">
      <input id="filter-road" type="text" placeholder="Search road / area…" />

      <select id="filter-condition">
        <option value="">All Conditions</option>
        <option value="Smooth">Smooth</option>
        <option value="Moderate">Moderate</option>
        <option value="Heavy">Heavy</option>
        <option value="Jam">Jam</option>
      </select>

      <button id="btn-refresh">Refresh</button>
      <button id="btn-pause" class="secondary">Pause Auto-Refresh</button>
    </div>

    <div id="traffic-list" class="traffic-list">
      Loading traffic data…
    </div>
  </div>


  <div id="popup-overlay" class="popup-overlay hidden">
    <div class="popup-card">
      <span id="popup-close" class="popup-close">&times;</span>
      <div id="popup-content">
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2025 Smart City Project</p>
  </footer>

</body>

</html>
