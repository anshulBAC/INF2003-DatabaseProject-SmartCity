<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart City Public Dashboard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/ui.js" defer></script>
  <script src="../js/traffic.js" defer></script>

</head>

<body>

  <nav>
    <a href="index.html" class="active">Home</a>
    <a href="overview.html">Overview</a>
    <a href="traffic.html">Traffic</a>
    <a href="transport.html">Transport</a>
    <a href="weather.html">Weather</a>
    <a href="accidents.html">Accidents</a>
    <a href="#" id="logout-btn" style="margin-left:auto;">Logout</a>
  </nav>


  <div class="container">
    <h1>Real-time Traffic Updates</h1>
    <p class="muted">Auto-refresh every 30 seconds</p>

    <div class="controls">
      <input id="filter-road" type="text" placeholder="Filter by road / area…" />
      <select id="filter-condition">
        <option value="">All Conditions</option>
        <option value="Smooth">Smooth</option>
        <option value="Moderate">Moderate</option>
        <option value="Heavy">Heavy</option>
        <option value="Jam">Jam</option>
      </select>
      <button id="btn-refresh">Refresh</button>
      <button id="btn-pause" class="secondary">Pause Auto-Refresh</button>
    </div>

    <div id="traffic-map" style="height: 600px; margin-top: 16px; border-radius: 8px; overflow: hidden;">
      Loading traffic…
    </div>
  </div>

  <div id="popup-overlay" class="popup-overlay hidden">
    <div class="popup-card">
      <span id="popup-close" class="popup-close">&times;</span>
      <div id="popup-content">
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2025 Smart City Project</p>
  </footer>

</body>

</html>
